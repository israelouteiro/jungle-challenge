services:
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.7.0
    ports: ['127.0.0.1:9090:9090']
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://localhost:9090/-/ready',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
  grafana:
    profiles: [observability]
    image: grafana/grafana:12.3.0
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/wagering.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://localhost:3000/api/health',
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  gateway:
    profiles: [app]
    image: nginx:1.28-alpine
    ports: ['3000:80']
    volumes: ['./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on:
      app:
        condition: service_healthy
  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.13.0
    ports: ['16686:16686', '4318:4318']
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jungle -d jungle']
      interval: 3s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.10
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports: ['4566:4566']
    volumes: ['./infra/localstack:/etc/localstack/init/ready.d:ro']
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs list-queues >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    profiles: [app]
    build: .
    command: ['bun', 'dist/infrastructure/database/migrate.js']
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
    depends_on:
      postgres:
        condition: service_healthy
  app:
    profiles: [app]
    build: .
    ports: ['3000']
    environment: &app-environment
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_EVENTS_URL: http://localstack:4566/000000000000/wagering-events.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 45s
  tools:
    profiles: [tools]
    build:
      context: .
      target: tools
    command: ['sleep', 'infinity']
    environment:
      <<: *app-environment
      LOAD_REQUESTS: ${LOAD_REQUESTS:-100}
      LOAD_CONCURRENCY: ${LOAD_CONCURRENCY:-10}
      LOAD_P95_MS: ${LOAD_P95_MS:-5000}
      LOAD_SAMPLE_MS: ${LOAD_SAMPLE_MS:-500}
      LOAD_DRAIN_TIMEOUT_MS: ${LOAD_DRAIN_TIMEOUT_MS:-60000}
      LOAD_ENVIRONMENT: ${LOAD_ENVIRONMENT:-Docker tools container; child Bun processes share the container resources}
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
  presentation:
    profiles: [observability]
    build:
      context: .
      target: tools
    init: true
    command: ['bun', 'scripts/presentation/server.ts']
    ports: ['127.0.0.1:3002:3002']
    environment:
      <<: *app-environment
      LOAD_URLS: http://app:3000
      LOAD_EXPECT_DRAIN: 'true'
      LOAD_ENVIRONMENT: Demonstracao pelo painel; tres replicas Compose
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      app:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
